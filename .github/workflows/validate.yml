name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Check that the schema is a valid JSON Schema
        run: check-jsonschema --check-metaschema streams.schema.json

      - name: Validate the example against the schema
        run: check-jsonschema --schemafile streams.schema.json streams.json
